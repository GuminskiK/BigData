services:
  # Zookeeper (used by older Confluent Kafka images)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    # Usunięto wolumeny, by stan Zookeepera (metadane) był czyszczony z każdym nowym kontenerem
    networks:
      - bigdata-net

  # Kafka broker (can be replaced with external broker by setting KAFKA_EXTERNAL=true and pointing producers/processors to it)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_LOG_RETENTION_BYTES: 2147483648 # 2GB
    # Usunięto wolumen tak aby state był ulotny pomiędzy usunięciem i stworzeniem kontenera.
    # Zapobiega to errorom z niezgodnym Cluster ID przy restarci w docker compose.
    networks:
      - bigdata-net

  # Kafka web UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # MongoDB (can be replaced with external Mongo by env override)
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata-net

  # Mongo-backed API for Grafana Infinity dashboards
  mongo-api:
    build:
      context: ./mongo-api
      dockerfile: Dockerfile
    container_name: mongo-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      MONGO_BACKEND: local
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_ANALYTICS: twitch_api_analytics
      MONGO_DB_CHAT: twitch_chat
      GOOGLE_TRENDS_DB_NAME: google_trends
    networks:
      - bigdata-net

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata-net

  # Spark cluster shared by TwitchChat and TwitchAPI jobs
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    restart: unless-stopped
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - bigdata-net

  spark-worker:
    build:
      context: ./TwitchChat/processor
      dockerfile: Dockerfile
    container_name: spark-worker
    restart: unless-stopped
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CLEANUP_ENABLED: "true"
      SPARK_WORKER_CLEANUP_INTERVAL: "900"
      SPARK_WORKER_APP_DATA_RETENTION: "7200"
    depends_on:
      - spark-master
    networks:
      - bigdata-net

  spark-worker-2:
    build:
      context: ./TwitchChat/processor
      dockerfile: Dockerfile
    container_name: spark-worker-2
    restart: unless-stopped
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CLEANUP_ENABLED: "true"
      SPARK_WORKER_CLEANUP_INTERVAL: "900"
      SPARK_WORKER_APP_DATA_RETENTION: "7200"
    depends_on:
      - spark-master
    networks:
      - bigdata-net

  # TwitchChat IRC producer
  twitchchat_producer:
    build:
      context: ./TwitchChat/producer
      dockerfile: Dockerfile.irc
    container_name: twitchchat_producer
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_CHAT: twitch_chat_stream
      TWITCH_TOKEN: ${TWITCH_TOKEN}
      TWITCH_NICK: ${TWITCH_NICK}
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # TwitchChat Spark streaming job
  twitchchat_processor:
    build:
      context: ./TwitchChat/processor
      dockerfile: Dockerfile
    container_name: twitchchat_processor
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_processor.py
    environment:
      PYSPARK_PYTHON: python3
      PYTHONUNBUFFERED: 1
      HADOOP_USER_NAME: spark
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_CHAT: twitch_chat_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: twitch-chat-raw
      MONGO_BACKEND: local
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      SPARK_CHECKPOINT_VERSION: ${SPARK_CHECKPOINT_VERSION:-v1}
    depends_on:
      - spark-master
      - kafka
      - mongodb
      - minio
    volumes:
      - spark_checkpoints_chat:/app/spark_checkpoints
    networks:
      - bigdata-net

  # TwitchAPI producer (Helix -> Kafka)
  twitchapi_producer:
    build:
      context: ./TwitchAPI/producer
      dockerfile: Dockerfile
    container_name: twitchapi_producer
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_API: twitch_api_stream
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # TwitchAPI Spark batch job (Kafka -> MinIO + MongoDB)
  twitchapi_batch_processor:
    build:
      context: ./TwitchAPI/processor
      dockerfile: Dockerfile
    container_name: twitchapi_batch_processor
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_batch_job.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_API: twitch_api_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: twitch-api-raw
      MONGO_BACKEND: local
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_ANALYTICS: twitch_api_analytics
    depends_on:
      - spark-master
      - mongodb
      - minio
    networks:
      - bigdata-net

  # Google Trends producer (search interest -> Kafka)
  googletrends_producer:
    build:
      context: ./GoogleTrends
      dockerfile: Dockerfile
    container_name: googletrends_producer
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_GOOGLE_TRENDS: google_trends_stream
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
      GOOGLE_TRENDS_TIMEFRAME: now 7-d
      GOOGLE_TRENDS_INTERVAL_MINUTES: 720
      GOOGLE_TRENDS_CHUNK_SIZE: 3
      GOOGLE_TRENDS_PAUSE_SECONDS: 30
      GOOGLE_TRENDS_MAX_RETRIES: 5
      GOOGLE_TRENDS_GEO: ""
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # Google Trends Spark batch job (Kafka -> MinIO + MongoDB)
  googletrends_batch_processor:
    build:
      context: ./GoogleTrends/processor
      dockerfile: Dockerfile
    container_name: googletrends_batch_processor
    restart: on-failure
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_batch_job.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_GOOGLE_TRENDS: google_trends_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: google-trends-raw
      MONGO_BACKEND: local
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      GOOGLE_TRENDS_DB_NAME: google_trends
      GOOGLE_TRENDS_TIMEFRAME: now 7-d
      GOOGLE_TRENDS_GEO: ""
    depends_on:
      - spark-master
      - kafka
      - mongodb
      - minio
    networks:
      - bigdata-net

  # Grafana dashboard layer using the local Mongo API
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - viz
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - mongo-api
    networks:
      - bigdata-net

volumes:
  mongodb_data:
  spark_checkpoints_chat:
  minio_data:
  grafana_data:

networks:
  bigdata-net:
    driver: bridge