version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  bigdata-net:
    driver: bridge

services:
  # --- INFRASTRUKTURA KRYTYCZNA ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOO_LOG4J_PROP: "WARN, CONSOLE"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    logging: *default-logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_SEGMENT_BYTES: 107374182
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "org.apache.kafka=WARN,org.apache.zookeeper=WARN,state.change.logger=WARN"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    deploy:
      resources:
        limits:
          memory: 1500M
    networks:
      - bigdata-net

  minio:
    image: minio/minio:latest
    container_name: minio
    logging: *default-logging
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata-net

  # --- SPARK CLUSTER ---

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    restart: unless-stopped
    logging: *default-logging
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - bigdata-net

  spark-worker:
    build:
      context: ./TwitchChat/processor
      dockerfile: Dockerfile
    container_name: spark-worker
    restart: unless-stopped
    logging: *default-logging
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 3
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CLEANUP_ENABLED: "true"
      SPARK_WORKER_CLEANUP_INTERVAL: "900"
      SPARK_WORKER_APP_DATA_RETENTION: "3600"
    depends_on:
      - spark-master
    networks:
      - bigdata-net

  # --- PRODUCENCI ---

  twitchchat_producer:
    build:
      context: ./TwitchChat/producer
      dockerfile: Dockerfile.irc
    container_name: twitchchat_producer
    restart: on-failure
    logging: *default-logging
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_CHAT: twitch_chat_stream
      TWITCH_TOKEN: ${TWITCH_TOKEN}
      TWITCH_NICK: ${TWITCH_NICK}
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
    depends_on:
      - kafka
    networks:
      - bigdata-net

  twitchapi_producer:
    build:
      context: ./TwitchAPI/producer
      dockerfile: Dockerfile
    container_name: twitchapi_producer
    restart: on-failure
    logging: *default-logging
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_API: twitch_api_stream
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
    depends_on:
      - kafka
    networks:
      - bigdata-net

  googletrends_producer:
    build:
      context: ./GoogleTrends
      dockerfile: Dockerfile
    container_name: googletrends_producer
    restart: on-failure
    logging: *default-logging
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_GOOGLE_TRENDS: google_trends_stream
      TWITCH_CHANNELS: ${TWITCH_CHANNELS:-xqc}
      GOOGLE_TRENDS_TIMEFRAME: now 7-d
      GOOGLE_TRENDS_INTERVAL_MINUTES: 720
      GOOGLE_TRENDS_CHUNK_SIZE: 3
      GOOGLE_TRENDS_PAUSE_SECONDS: 30
      GOOGLE_TRENDS_MAX_RETRIES: 5
      GOOGLE_TRENDS_GEO: ""
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # --- PROCESORY SPARK ---

  twitchchat_processor:
    build:
      context: ./TwitchChat/processor
      dockerfile: Dockerfile
    container_name: twitchchat_processor
    logging: *default-logging
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.executor.memory=512m"
      --conf "spark.driver.memory=512m"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_processor.py
    environment:
      PYSPARK_PYTHON: python3
      PYTHONUNBUFFERED: 1
      HADOOP_USER_NAME: spark
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_CHAT: twitch_chat_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: twitch-chat-raw
      MONGO_BACKEND: ${MONGO_BACKEND:-atlas}
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_CHAT: ${MONGO_DB_CHAT:-twitch_chat}
      SPARK_CHECKPOINT_VERSION: ${SPARK_CHECKPOINT_VERSION:-v1}
    depends_on:
      - spark-master
      - kafka
      - minio
    volumes:
      - spark_checkpoints_chat:/app/spark_checkpoints
    networks:
      - bigdata-net

  twitchapi_batch_processor:
    build:
      context: ./TwitchAPI/processor
      dockerfile: Dockerfile
    container_name: twitchapi_batch_processor
    logging: *default-logging
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.executor.memory=512m"
      --conf "spark.driver.memory=512m"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_batch_job.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_TWITCH_API: twitch_api_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: twitch-api-raw
      MONGO_BACKEND: ${MONGO_BACKEND:-atlas}
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_ANALYTICS: ${MONGO_DB_ANALYTICS:-twitch_api_analytics}
    depends_on:
      - spark-master
      - minio
    networks:
      - bigdata-net

  googletrends_batch_processor:
    build:
      context: ./GoogleTrends/processor
      dockerfile: Dockerfile
    container_name: googletrends_batch_processor
    logging: *default-logging
    restart: on-failure
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.cores.max=1"
      --conf "spark.executor.memory=512m"
      --conf "spark.driver.memory=512m"
      --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/app/.ivy2 -Duser.home=/app -Duser.name=spark"
      --conf "spark.executor.extraJavaOptions=-Duser.name=spark"
      --conf "spark.hadoop.user.name=spark"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      /app/spark_batch_job.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_GOOGLE_TRENDS: google_trends_stream
      MINIO_ENDPOINT_DOCKER: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: google-trends-raw
      MONGO_BACKEND: ${MONGO_BACKEND:-atlas}
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_TRENDS: ${MONGO_DB_TRENDS:-google_trends}
      GOOGLE_TRENDS_TIMEFRAME: now 7-d
      GOOGLE_TRENDS_GEO: ""
    depends_on:
      - spark-master
      - kafka
      - minio
    volumes:
      - googletrends_checkpoints:/app/spark_checkpoints
    networks:
      - bigdata-net

  # --- POBOCZNE (Profile: tools, viz) ---

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["tools"]
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - bigdata-net

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    profiles: ["tools"]
    logging: *default-logging
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata-net

  mongo-api:
    build:
      context: ./mongo-api
      dockerfile: Dockerfile
    container_name: mongo-api
    profiles: ["tools"]
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      MONGO_BACKEND: ${MONGO_BACKEND:-atlas}
      MONGO_URI_LOCAL: mongodb://mongodb:27017
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_ANALYTICS: ${MONGO_DB_ANALYTICS:-twitch_api_analytics}
      MONGO_DB_CHAT: ${MONGO_DB_CHAT:-twitch_chat}
      GOOGLE_TRENDS_DB_NAME: ${GOOGLE_TRENDS_DB_NAME:-google_trends}
    networks:
      - bigdata-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["viz"]
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - mongo-api
    networks:
      - bigdata-net

volumes:
  mongodb_data:
  spark_checkpoints_chat:
  googletrends_checkpoints:
  minio_data:
  grafana_data: